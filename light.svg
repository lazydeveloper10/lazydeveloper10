<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Fira Code', monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .live-badge { animation: pulse 2s infinite ease-in-out; }
      .floating { animation: float 4s infinite ease-in-out; }
      .dots { stroke-dasharray: 4, 4; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer Terminal Box -->
  <rect x="5" y="5" width="1170" height="600" rx="14" fill="url(#bgGrad)" stroke="#0891B2" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Header Bar -->
  <path d="M 5 19 A 14 14 0 0 1 19 5 L 1161 5 A 14 14 0 0 1 1175 19 L 1175 45 L 5 45 Z" fill="#E2E8F0"/>
  <line x1="5" y1="45" x2="1175" y2="45" stroke="#0891B2" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Controls -->
  <circle cx="30" cy="25" r="6" fill="#EF4444"/>
  <circle cx="50" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="25" r="6" fill="#10B981"/>
  
  <!-- Header Title -->
  <text x="100" y="30" fill="#475569" font-size="14" font-weight="500">profile.sh --live</text>
  
  <!-- LIVE Pill -->
  <g transform="translate(930, 14)">
    <rect x="0" y="0" width="64" height="22" rx="11" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#EF4444" class="live-badge"/>
    <text x="24" y="15" fill="#DC2626" font-size="11" font-weight="700">LIVE</text>
  </g>
  
  <!-- Handle Pill (Wider pill box with centered text) -->
  <g transform="translate(1005, 14)">
    <rect x="0" y="0" width="155" height="22" rx="11" fill="#0891B2" fill-opacity="0.15" stroke="#0891B2" stroke-width="1"/>
    <text x="77" y="15" fill="#0891B2" font-size="11" font-weight="600" text-anchor="middle">@lazydeveloper10</text>
  </g>

  <!-- LEFT PANEL: VISUAL.MAP -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="410" height="510" rx="10" fill="#F8FAFC" stroke="#0891B2" stroke-width="1" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#0891B2" font-size="13" font-weight="700" letter-spacing="1">VISUAL.MAP</text>
    <line x1="20" y1="40" x2="390" y2="40" stroke="#0891B2" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Matrix Grid Visual -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="360" height="410" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.3"/>
      
      <!-- Nodes & Lines -->
      <path d="M 40 50 L 120 120 L 220 80 L 300 160 L 180 240 L 80 200 Z" fill="none" stroke="#0891B2" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4"/>
      <path d="M 80 200 L 180 240 L 280 320 L 140 360 L 60 300 Z" fill="none" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4,4"/>
      
      <!-- Pulsing Nodes -->
      <circle cx="40" cy="50" r="5" fill="#0891B2"/>
      <circle cx="120" cy="120" r="7" fill="#7C3AED"/>
      <circle cx="220" cy="80" r="4" fill="#059669"/>
      <circle cx="300" cy="160" r="8" fill="#0891B2" class="live-badge"/>
      <circle cx="180" cy="240" r="6" fill="#D97706"/>
      <circle cx="80" cy="200" r="5" fill="#7C3AED"/>
      <circle cx="280" cy="320" r="7" fill="#059669"/>
      <circle cx="140" cy="360" r="5" fill="#0891B2"/>
      <circle cx="60" cy="300" r="6" fill="#DC2626"/>

      <!-- Center Logo Glyph -->
      <g transform="translate(180, 180)" class="floating">
        <circle cx="0" cy="0" r="38" fill="#E2E8F0" stroke="url(#accentGrad)" stroke-width="2"/>
        <text x="-24" y="8" fill="#0F172A" font-size="22" font-weight="700">&lt;/&gt;</text>
      </g>

      <text x="20" y="390" fill="#64748B" font-size="11">SYSTEM_TRAJECTORY // OPTIMAL_TRANSPORT</text>
    </g>
  </g>

  <!-- RIGHT PANEL: SYSTEM.INFO -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="680" height="510" rx="10" fill="#F8FAFC" stroke="#0891B2" stroke-width="1" stroke-opacity="0.4"/>
    <text x="25" y="30" fill="#0891B2" font-size="13" font-weight="700" letter-spacing="1">SYSTEM.INFO</text>
    <line x1="25" y1="40" x2="655" y2="40" stroke="#0891B2" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Rows with Dotted Leaders -->
    <g transform="translate(25, 75)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Subject</text>
      <line x1="85" y1="-4" x2="520" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#0F172A" font-size="14" font-weight="600" text-anchor="end">Soham</text>
    </g>

    <g transform="translate(25, 115)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Alias</text>
      <line x1="70" y1="-4" x2="350" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#7C3AED" font-size="14" font-weight="600" text-anchor="end">SohamTheHacker (@lazydeveloper10)</text>
    </g>

    <g transform="translate(25, 155)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Role</text>
      <line x1="60" y1="-4" x2="380" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#0F172A" font-size="14" font-weight="500" text-anchor="end">AI Engineer &amp; Systems Architect</text>
    </g>

    <g transform="translate(25, 195)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Origin</text>
      <line x1="75" y1="-4" x2="350" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#475569" font-size="14" font-weight="500" text-anchor="end">Mathematician &amp; Chaos Engineer</text>
    </g>

    <g transform="translate(25, 235)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Core.Lang</text>
      <line x1="100" y1="-4" x2="310" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#059669" font-size="14" font-weight="600" text-anchor="end">Python · C · C++ · Kotlin · JavaScript</text>
    </g>

    <g transform="translate(25, 275)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">ToolChain</text>
      <line x1="100" y1="-4" x2="360" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#0F172A" font-size="14" font-weight="500" text-anchor="end">VS Code · Linux · Docker · Git</text>
    </g>

    <g transform="translate(25, 315)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Focus</text>
      <line x1="70" y1="-4" x2="280" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#7C3AED" font-size="14" font-weight="500" text-anchor="end">AI/ML Models · Telemetry · Streaming Engines</text>
    </g>

    <g transform="translate(25, 355)">
      <text x="0" y="0" fill="#0891B2" font-size="14" font-weight="600">Status</text>
      <line x1="80" y1="-4" x2="360" y2="-4" stroke="#94A3B8" stroke-width="1" class="dots"/>
      <text x="630" y="0" fill="#059669" font-size="14" font-weight="600" text-anchor="end">Building + Learning + Shipping</text>
    </g>

    <g transform="translate(25, 410)">
      <rect x="0" y="0" width="630" height="60" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#0891B2" font-size="14" font-weight="600">&gt; motto:</text>
      <text x="95" y="35" fill="#0F172A" font-size="14" font-style="italic">"I don't break things... I redesign them."</text>
    </g>
  </g>
</svg>
